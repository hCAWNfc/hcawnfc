name: install-from-pypi
# Checks that `pip install hcawn-fc` works on Linux / macOS / Windows and that the hosted API answers.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install hcawn-fc
      - run: hcawn-fc doctor
      - run: hcawn-fc "Turn on the flashlight"
      - run: hcawn-fc --json "Add a calendar event Team Sync tomorrow at 2pm"
