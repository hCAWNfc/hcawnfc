[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcawn-fc"
version = "0.1.2"
description = "Tiny CPU function-calling model for phone actions (hCAWN-FC) with a client for the hosted API"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "CAWN AI" }]
keywords = ["function calling", "tool calling", "on-device", "cpu", "small language model", "byte-level"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://cawnai.com"
Repository = "https://github.com/hCAWNfc/hcawnfc"
Issues = "https://github.com/hCAWNfc/hcawnfc/issues"
[project.scripts]
hcawn-fc = "hcawn_fc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hcawn_fc = ["data/*.json", "data/*.bin"]
